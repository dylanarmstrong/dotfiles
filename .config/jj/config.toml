#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
email = "dylan@dylan.is"
name = "Dylan Armstrong"

[merge-tools.nvim]
merge-args = ["$output"]
merge-tool-edits-conflict-markers = true

[ui]
default-command = "log"
diff-formatter = ":git"
pager = "delta"
merge-editor = "nvim"
diff-instructions = false
diff-editor = ":builtin"

[signing]
backend = "ssh"
behavior = "drop"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJpQNEFHxmhIZv639zMV+jlJ4nHKV7Og5+BkQcZBitYe"

[revsets]
log = "::@"
git-sign-on-push = "~signed() & mine()"

[[--scope]]
--when.platforms = ["macos"]
[--scope.signing.backends.ssh]
program = "/Applications/1Password.app/Contents/MacOS/op-ssh-sign"
